site_name: HILT
site_url: https://gitlab.com/Tyler-Meador/HILT/-/tree/main/docs/
site_description: "Python HIL testing with a pit of success: composable tests, guardrails that make a bad test hard to write, and an engine that won't let an unhandled failure pass silently."
repo_url: https://gitlab.com/Tyler-Meador/HILT
edit_uri: -/blob/main/docs/
copyright: Copyright 2026 Tyler Meador

# Material for MkDocs. The palette follows the reader's system setting until they pick
# a side with the header toggle, and the choice is remembered. Everything the theme
# needs to draw a page is in the build: `font: false` keeps it on the system font stack
# instead of fetching a web font, because the site is opened from a clone with no
# network (#138). The colours themselves are in docs/assets/stylesheets/hilt.css.
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chip
    repo: fontawesome/brands/gitlab
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Following the system setting. Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode. Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode. Switch to the system setting
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/hilt.css

# The offline plugin (below) needs this shim to run search from file://. Naming a local
# copy here stops it from adding the CDN one.
extra:
  polyfills:
    - assets/javascripts/iframe-worker-shim.js

strict: true
docs_dir: docs
site_dir: site
# Nothing hosts the site (#138). A release branch commits the build under
# docs/site/, opened from a clone as file://, so links end in .html rather than
# in a directory the filesystem cannot resolve; and that committed build must not
# be swept into the next one.
use_directory_urls: false
exclude_docs: |
  site/

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Floor Technician: floor-technician.md
  - Overview: overview.md
  - Lifecycle: lifecycle.md
  - Idioms: idioms.md
  - Utilities: utilities.md
  - Contracts: contracts.md
  - Inspector JSON: inspector-json.md
  - Inspector (target specification): inspector.md
  - Measurements: measurements.md
  - JUnit XML: junit-xml.md
  - hilt run: hilt-run.md
  - hilt new: hilt-new.md
  - hilt-check: hilt-check.md
  - API stability: api-stability.md
  - API reference: api.md
  - HIL interfaces:
      - Overview: hil/index.md
      - GPIO (design note): hil/gpio.md
      - PWM (design note): hil/pwm.md
      - CAN bus (design note): hil/can.md
      - I2C/SPI (design note): hil/i2c-spi.md
      - Device API (design note): hil/device-api.md
      - Serial/UART (design note): hil/serial.md

plugins:
  - search
  # Inlines the search index so the search box works on a build opened as file://.
  - offline
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # A ```mermaid fence is drawn as a diagram, in the colours of the active palette,
  # the same source GitLab draws on `main`.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
